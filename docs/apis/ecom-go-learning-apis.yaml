  /health:
    get:
      tags:
        - default
      summary: Health
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/v1/users/login:
    post:
      tags:
        - User
      summary: Login
      description: |
        Authenticates a user and returns a token pair (access token and refresh token).
        Access tokens have a short lifespan (30 minutes by default), while refresh tokens
        are valid for longer periods (7 days by default).
        
        You can request tokens to be stored as cookies by setting the 'use_cookies' parameter to true.
      parameters:
        - name: use_cookies
          in: query
          schema:
            type: boolean
          required: false
          description: If true, authentication tokens will be set as HTTP-only cookies
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              required:
                - email
                - password
              example:
                email: 'user@example.com'
                password: 'password123'
      responses:
        '200':
          description: Successful login
          headers:
            Set-Cookie:
              description: |
                Set when use_cookies=true. Contains two cookies:
                - access_token: Short-lived JWT for API access
                - refresh_token: Long-lived token used for refreshing access
              schema:
                type: string
                example: "access_token=eyJhbGciOi...; HttpOnly; Path=/; Max-Age=1800, refresh_token=eyJhbGciOi...; HttpOnly; Path=/; Max-Age=604800"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                example:
                  error: "invalid input"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                example:
                  error: "server error"
  /api/v1/users/refresh:
    post:
      tags:
        - User
      summary: Refresh tokens
      description: |
        Exchanges a valid refresh token for a new token pair (access token and refresh token).
        The old refresh token is invalidated when used.
        
        When using cookie-based authentication, you don't need to send the refresh token
        in the request body as it will be read from the cookie.
      parameters:
        - name: use_cookies
          in: query
          schema:
            type: boolean
          required: false
          description: If true, authentication tokens will be set as HTTP-only cookies
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Refresh token obtained from login
              required:
                - refresh_token
              example:
                refresh_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      responses:
        '200':
          description: Successful token refresh
          headers:
            Set-Cookie:
              description: Set when use_cookies=true. Updates both cookies with new tokens.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/logout:
    post:
      tags:
        - User
      summary: Logout
      description: |
        Invalidates the refresh token, effectively logging out the user.
        When using cookie-based authentication, this endpoint will also clear the auth cookies.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Refresh token to invalidate (not required when using cookies)
              example:
                refresh_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      responses:
        '200':
          description: Successfully logged out
          headers:
            Set-Cookie:
              description: Clears authentication cookies when using cookie-based auth
              schema:
                type: string
                example: "access_token=; HttpOnly; Path=/; Max-Age=0, refresh_token=; HttpOnly; Path=/; Max-Age=0"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Successfully logged out"
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
