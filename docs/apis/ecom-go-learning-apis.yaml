openapi: 3.0.0
info:
  title: ecom-go-learning
  version: 1.0.0
  description: |
    # Authentication
    
    This API supports two authentication methods:
    
    ## Bearer Token
    
    1. Call `POST /api/v1/users/login` to get access and refresh tokens
    2. Include the access token in the Authorization header:
       ```
       Authorization: Bearer your_access_token
       ```
    3. When the access token expires (after 30 minutes by default), call 
       `POST /api/v1/users/refresh` with your refresh token to get a new token pair
    4. To logout, call `POST /api/v1/users/logout` with your refresh token
    
    ## Cookie-Based Authentication
    
    1. Call `POST /api/v1/users/login?use_cookies=true` to login
    2. The response will set HTTP-only cookies containing the tokens
    3. Make API requests as normal - the access token will be automatically included
    4. When the access token expires, call `POST /api/v1/users/refresh` to refresh tokens
    5. To logout, call `POST /api/v1/users/logout` to invalidate the session
    
    ## Token Lifetimes
    
    - Access tokens: 30 minutes by default
    - Refresh tokens: 7 days by default
servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: http://localhost:8080
        description: Base URL for the API server
        enum:
          - http://localhost:8080
          - https://api.ecom-go-learning.example.com
          - https://staging-api.ecom-go-learning.example.com
tags:
  - name: User
  - name: Product
  - name: Product > Item
  - name: Category
  - name: Category > Relations
  - name: Order
  - name: Address
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token authentication using the Bearer scheme.
        You can obtain tokens through the /users/login endpoint and refresh them with /users/refresh.
    
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        Authentication using HTTP-only cookies.
        Cookies are automatically set when calling /users/login with the 'use_cookies=true' parameter.
  schemas:
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token for API authorization
        refresh_token:
          type: string
          description: JWT refresh token used to obtain new access tokens
        expires_in:
          type: integer
          description: Access token expiration time in seconds
      example:
        access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        expires_in: 1800
    
    User:
      type: object
      properties:
        id:
          type: integer
          description: User ID
        email:
          type: string
          description: User email
        first_name:
          type: string
          description: User first name
        last_name:
          type: string
          description: User last name
        role:
          type: string
          description: User role
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
      example:
        id: 1
        email: test@example.com
        first_name: "John"
        last_name: "Doe"
        role: "user"
        addresses: []
    
    Product:
      type: object
      properties:
        id:
          type: integer
          description: Product ID
        code:
          type: string
          description: Product code
        name:
          type: string
          description: Product name
        description:
          type: string
          description: Product description
        price:
          type: number
          format: float
          description: Product price
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
      example:
        id: 1
        code: "elec.laptop"
        name: "MacBook Pro"
        description: "Powerful laptop for developers"
        price: 1999.99
        categories: []
        created_at: "2023-01-15T14:30:00Z"
        updated_at: "2023-03-20T09:15:00Z"
    
    Category:
      type: object
      properties:
        id:
          type: integer
          description: Category ID
        name:
          type: string
          description: Category name
        description:
          type: string
          description: Category description
        sub_categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: 1
        name: "Electronics"
        description: "Electronic devices and accessories"
        sub_categories: []
        products: []
        created_at: "2023-01-10T10:00:00Z"
        updated_at: "2023-01-10T10:00:00Z"
    
    Item:
      type: object
      properties:
        id:
          type: integer
          description: Item ID
        product_id:
          type: integer
          description: Reference to the product
        order_id:
          type: integer
          nullable: true
          description: Reference to the order if sold
        status:
          type: string
          enum: [available, sold]
          description: Item status
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: 1
        product_id: 5
        order_id: null
        status: "available"
        created_at: "2023-02-20T14:30:00Z"
        updated_at: "2023-02-20T14:30:00Z"
    
    Address:
      type: object
      properties:
        id:
          type: integer
          description: Address ID
        user_id:
          type: integer
          description: Reference to the user
        full_name:
          type: string
          description: Full name for the address
        phone_number:
          type: string
          description: Contact phone number
        address_line:
          type: string
          description: Full address line
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: 1
        user_id: 5
        full_name: "John Doe"
        phone_number: "+1234567890"
        address_line: "123 Main St, Anytown, USA"
        created_at: "2023-02-20T14:30:00Z"
        updated_at: "2023-02-20T14:30:00Z"
    
    Order:
      type: object
      properties:
        id:
          type: integer
          description: Order ID
        userId:
          type: integer
          description: Reference to the user
        status:
          type: string
          enum: [created, processed, intransit, complete]
          description: Order status
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
          description: Items associated with this order
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 1
        userId: 5
        status: "created"
        items: [
          {
            id: 1,
            product_id: 5,
            order_id: 1,
            status: "sold",
            created_at: "2023-02-20T14:30:00Z",
            updated_at: "2023-03-15T10:30:00Z"
          },
          {
            id: 2,
            product_id: 6,
            order_id: 1,
            status: "sold",
            created_at: "2023-02-21T11:15:00Z",
            updated_at: "2023-03-15T10:30:00Z"
          }
        ]
        createdAt: "2023-03-15T10:30:00Z"
        updatedAt: "2023-03-15T10:30:00Z"
    
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
      example:
        error: "resource not found"
    
    ValidationError:
      type: object
      properties:
        error:
          type: string
          description: Error type
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
      example:
        error: "validation error"
        details:
          - field: "email"
            message: "must be a valid email"
          - field: "password"
            message: "must be at least 8 characters"
